name: Check PR
on:
  pull_request:
    branches:
      - main
      - develop
jobs:
  check-build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://dev.aurorasteamgt.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: hugo-site:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the site
        run: docker compose --profile build-development run --rm build-development
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}